<!doctype html>
<html lang="en-US" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="color-scheme" content="dark light" />
    <!-- seo: rewritten per public page by scripts/prerender.mjs, then live by src/shop/seo.js -->
    <title>Captain Slabbin | Top shelf. Delivered.</title>
    <meta name="description" content="Captain Slabbin: top shelf flower, concentrates, moonrocks, disposables, prerolls, edibles and more. Pay with crypto in one tap, discreet tracked shipping across the US. Adults 21+ only." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:site_name" content="Captain Slabbin" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Captain Slabbin | Top shelf. Delivered." />
    <meta property="og:description" content="Top shelf flower, carts, edibles and more. Crypto checkout, discreet tracked shipping across the USA. 21+." />
    <meta property="og:image" content="/brand/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /seo -->
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="United States" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/brand/logo.webp" />
    <script>
      // Theme before first paint, so a light-mode visitor never sees a dark flash
      (function () {
        var t = 'dark'
        try {
          t = localStorage.getItem('cs_theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) { t = 'dark' }
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f1ec')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
