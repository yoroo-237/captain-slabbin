<!doctype html>
<html lang="en-US" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070708" />
    <meta name="color-scheme" content="dark light" />
    <title>Captain Slabbin</title>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <link rel="preload" as="image" href="/brand/logo.webp" />
    <script>
      // Theme before first paint, so a light-mode visitor never sees a dark flash
      (function () {
        var t = 'dark'
        try {
          t = localStorage.getItem('cs_theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) { t = 'dark' }
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f1ec')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
