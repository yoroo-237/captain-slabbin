[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# The database is only reachable once the service runs (Railway's private network
# is off during the build): migrations and the seed run in preDeployCommand.
cmds = ["npx prisma generate"]

[start]
cmd = "node src/server.js"
